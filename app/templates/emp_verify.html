{% extends "emp_base.html" %}
{% block body %}
<div class="card">
  <h1>{{ tr.t('welcome') }} {{ dname(emp.data) }}</h1>
  <p>{{ tr.t('verify_text') }}</p>
  {% if locked %}<div class="flash err">{{ tr.t('locked') }}</div>
  {% elif failed %}<div class="flash err">{{ tr.t('mismatch') }}</div>{% endif %}
  {% if not locked %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div class="field"><label for="l4">{{ tr.t('last4') }}</label>
      <input id="l4" name="last4" type="text" inputmode="numeric" maxlength="4" class="ltr" autocomplete="off" required autofocus></div>
    <button class="btn" type="submit">{{ tr.t('continue') }}</button>
  </form>
  {% endif %}
</div>
{% endblock %}
