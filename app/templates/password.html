{% extends "base.html" %}
{% block title %}كلمة المرور{% endblock %}
{% block body %}
<div class="card narrow">
  <h1>تغيير كلمة المرور</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div class="field"><label for="o">الحالية</label><input id="o" name="old" type="password" class="ltr" autocomplete="current-password" required></div>
    <div class="field"><label for="n">الجديدة (10 خانات فأكثر)</label><input id="n" name="new" type="password" class="ltr" autocomplete="new-password" required></div>
    <button class="btn" type="submit">حفظ</button>
  </form>
</div>
{% endblock %}
